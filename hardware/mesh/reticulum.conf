[reticulum]
  instance_name = opi-reticulum
  share_instance = yes
  enable_transport = no

[interfaces]
  [[Local TCP]]
    type = TCPServerInterface
    enabled = yes
    listen_ip = 127.0.0.1
    listen_port = 4242

  [[Waveshare SX1262 RX]]
    type = RNodeInterface
    enabled = no
    outgoing = no
    port = tcp://127.0.0.1
    frequency = 433875000
    bandwidth = 125000
    spreadingfactor = 9
    codingrate = 5
    txpower = 0
    flow_control = yes
